<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tambah</title>
  
  <link rel="stylesheet" href="style.css">
</head>
<a href="daftar.html">daftar.html</a>
<body>
  <div cclass="container">
  <h1>form tambah siswa</h1>
  
  <form id='fromTambah'>
  <label>NIS</label>
  <input type="text" id="nis"/>
  
  <label>nama</label>
  <input type="text" id="nama"/>
  
  <label>kelas</label>
  <select name="kelas" id="kelas">
  <option value="X">X</option>
  <option value="XI">XI</option>
  <option value="XII">XII</option>
  </select>
  
  <button type="tombolSimpan">simpan</button>
  </form>

  </div>
  <script type="module">
    import {tambahDataSiswa} from './main.js'
    
    //mengirimkan data siswa baru dari form
    const formTambah = document.getElementById('fromTambah')
    
    //event ketika form disubmit (dikirim)
    formTambah.addEventListener('submit', function (e) {
      //mencegah reload halaman 
      e.preventDefault()
      
      tambahDataSiswa()
      
      //eksekusi fungsi tambah data siswa
      tambahDataSiswa()
    })
  </script>
</body>
</html>
